# Publishes the promo website (the `website` folder) to GitHub Pages.
# One-time setup in GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy website to GitHub Pages

on:
  push:
    branches: [claude/dog-owner-mobile-app-1vb124, main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
